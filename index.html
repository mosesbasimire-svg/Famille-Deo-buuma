<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma Caisse</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111827">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:22px 18px;border-radius:0 0 22px 22px}h1{margin:0 0 5px;font-size:27px}.sub{opacity:.75}main{padding:18px;max-width:680px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:0;border-radius:18px;background:#fff;color:#111827;padding:18px;min-height:110px;text-align:left;box-shadow:0 3px 12px #0001;font-size:17px}.card b{display:block;margin-top:12px}.orange{border-left:6px solid #f97316}.red{border-left:6px solid #ef4444}.green{border-left:6px solid #16a34a}.blue{border-left:6px solid #2563eb}.section{background:#fff;padding:18px;border-radius:18px;margin-top:14px;box-shadow:0 3px 12px #0001}.hidden{display:none}button{border:0;border-radius:12px;padding:12px 15px;background:#111827;color:#fff;font-size:15px;margin:4px;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}.danger{background:#b91c1c}input,select,textarea{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 12px;font-size:16px}.row{display:flex;gap:8px;flex-wrap:wrap}.stat{font-size:24px;font-weight:bold}.op{padding:12px 0;border-bottom:1px solid #eee}.small{font-size:13px;color:#6b7280}.profile{display:flex;align-items:center;gap:14px}.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#e5e7eb;border:3px solid #fff;box-shadow:0 2px 8px #0002}.signature{width:100%;height:180px;border:2px dashed #9ca3af;border-radius:12px;background:#fff;touch-action:none}.login{position:fixed;inset:0;background:#07142f;display:flex;align-items:flex-end;justify-content:center;z-index:9999;overflow:auto}.login:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,#07142f33,#07142fee 65%,#07142f),url("money-welcome.png") center top/cover no-repeat}.loginbox{position:relative;background:#081939f5;color:#fff;width:min(520px,100%);padding:24px 22px 28px;border-radius:30px 30px 0 0;text-align:center;box-shadow:0 -8px 35px #0008;margin-top:48vh}.loginbrand{font-size:30px;font-weight:800}.loginbrand span{color:#facc15}.loginbox input{text-align:center;font-size:24px;letter-spacing:5px;background:#fff}.loginbox button{width:100%;background:#facc15;color:#07142f;font-weight:800;font-size:17px}.error{color:#fca5a5;min-height:22px}.cameraBox{background:#111827;border-radius:14px;padding:8px}.cameraBox video{width:100%;max-height:260px;object-fit:cover;border-radius:10px;background:#000}.thumb{width:100%;max-height:260px;object-fit:cover;border-radius:10px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e5e7eb;font-size:12px}.signaturePreview{width:100%;max-height:130px;object-fit:contain;border:1px solid #ddd;border-radius:10px;background:#fff}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}.note{background:#eff6ff;padding:10px;border-radius:10px;font-size:13px}
</style></head>
<body>
<div id="login" class="login"><div class="loginbox">
<div class="loginbrand">💼 Ma <span>Caisse</span></div><p>Votre argent, votre contrôle</p>
<h2>🔐 Accès sécurisé</h2><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="Mot de passe">
<div id="loginError" class="error"></div><button onclick="unlock()">🔓 Accéder</button>
<p class="small" style="color:#bfdbfe">Après 3 codes incorrects, la caméra avant peut être demandée pour enregistrer une capture de sécurité.</p>
</div></div>
<header><div class="topbar"><div><h1>📱 Ma Caisse</h1><div class="sub">Gestion de vos activités commerciales</div></div><div id="profileMini"></div></div></header>
<main><div id="home"><div id="homeCloud" class="small section" style="margin-top:0">☁️ Vérification de la sauvegarde en ligne...</div>
<div class="grid">
<button class="card orange" onclick="openNet('Orange Money')">🟠<b>Orange Money</b></button><button class="card red" onclick="openNet('Airtel Money')">🔴<b>Airtel Money</b></button>
<button class="card green" onclick="openNet('M-Pesa')">🟢<b>M-Pesa</b></button><button class="card blue" onclick="openNet('Afrimoney')">🔵<b>Afrimoney</b></button>
<button class="card" onclick="openCash()">💵<b>Caisse</b></button><button class="card" onclick="openReports()">📊<b>Rapports</b></button>
<button class="card" onclick="openOther()">➕<b>Autres activités</b></button><button class="card" onclick="openSettings()">⚙️<b>Paramètres</b></button>
</div></div><div id="page" class="section hidden"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const APP_PASSWORD="20072007";
const SUPABASE_URL="https://lgzgzavicxefuqbpzkcc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_MbyLWL9_tvNuDwXZjcAZIA_E9H0J2q0";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let currentUser=null, db=JSON.parse(localStorage.getItem('macaisse_v2')||'{"operations":[],"others":[],"debts":[]}',safeJson);
function safeJson(){return {operations:[],others:[],debts:[]}}
if(!Array.isArray(db.operations))db.operations=[];if(!Array.isArray(db.others))db.others=[];if(!Array.isArray(db.debts))db.debts=[];
let failedAttempts=0,lockTimer=null,cameraStream=null,signaturePad=null,profileUrl=null;
function save(){localStorage.setItem('macaisse_v2',JSON.stringify(db))}function money(n){return Number(n||0).toLocaleString('fr-FR')+' FC'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateHomeCloud(r){let e=document.getElementById('homeCloud');if(e)e.textContent=r?.ok?'☁️ Sauvegarde en ligne : connectée':'☁️ Sauvegarde en ligne : non connectée'}
async function connectCloud(){try{let s=await sb.auth.getSession();currentUser=s.data.session?.user||null;if(!currentUser){let a=await sb.auth.signInAnonymously();if(a.error)throw a.error;currentUser=a.data.user}updateHomeCloud({ok:true});await loadCloudData();await loadProfile();return {ok:true}}catch(e){console.error(e);updateHomeCloud({ok:false});return {ok:false,error:e}}}
async function loadCloudData(){if(!currentUser)return;try{let o=await sb.from('operations').select('*').eq('user_id',currentUser.id);if(!o.error&&o.data){for(const r of o.data){const x={id:String(r.local_id||r.id),cloudId:r.id,network:r.reseau,type:r.type_operation,client:r.client||'',amount:Number(r.montant||0),commission:Number(r.commission||0),note:r.observation||'',date:r.created_at||new Date().toISOString()};if(!db.operations.some(a=>a.id===x.id))db.operations.push(x)}}let d=await sb.from('dettes').select('*').eq('user_id',currentUser.id);if(!d.error&&d.data){for(const r of d.data){const x={id:String(r.id),network:r.reseau,client:r.client,amount:Number(r.montant),note:r.observation||'',date:r.created_at,paid:!!r.paid,paidDate:r.paid_at||null,signatureDebt:r.signature_debt||null,paymentSignature:r.payment_signature||null};const i=db.debts.findIndex(a=>a.id===x.id);if(i<0)db.debts.push(x);else db.debts[i]=x}}save()}catch(e){console.warn('Chargement cloud:',e)}}
async function cloudAddOperation(x){if(!currentUser)return;let {error}=await sb.from('operations').insert({local_id:x.id,user_id:currentUser.id,reseau:x.network,type_operation:x.type,client:x.client||null,montant:x.amount,commission:x.commission||0,observation:x.note||null,created_at:x.date});if(error)throw error}
async function cloudDeleteOperation(x){if(!currentUser)return;let q=sb.from('operations').delete().eq('user_id',currentUser.id).eq('local_id',x.id);let {error}=await q;if(error)throw error}
async function cloudAddActivity(name){if(!currentUser)return;let {error}=await sb.from('autres_activites').insert({user_id:currentUser.id,nom:name});if(error)throw error}
async function cloudAddDebt(d){if(!currentUser)throw Error('Aucune session Supabase.');let {error}=await sb.from('dettes').insert({id:d.id,user_id:currentUser.id,reseau:d.network,client:d.client,montant:d.amount,observation:d.note||null,created_at:d.date,paid:false,signature_debt:d.signatureDebt||null});if(error)throw error}
async function cloudPayDebt(d){if(!currentUser)throw Error('Aucune session Supabase.');let {error}=await sb.from('dettes').update({paid:true,paid_at:d.paidDate,payment_signature:d.paymentSignature||null}).eq('id',d.id).eq('user_id',currentUser.id);if(error)throw error}
async function cloudDeleteDebt(d){if(!currentUser)throw Error('Aucune session Supabase.');let {error}=await sb.from('dettes').delete().eq('id',d.id).eq('user_id',currentUser.id);if(error)throw error}
async function loadProfile(){if(!currentUser)return;try{let {data}=await sb.from('user_profiles').select('*').eq('id',currentUser.id).maybeSingle();if(data?.photo_path){let s=await sb.storage.from('profile-photos').createSignedUrl(data.photo_path,3600);profileUrl=s.data?.signedUrl||null;renderProfileMini()}}catch(e){console.warn(e)}}
async function saveProfilePhoto(file){if(!currentUser)throw Error('Connexion Supabase non prête.');let blob=await compressImage(file,900,.82),path=currentUser.id+'/profile.jpg';let u=await sb.storage.from('profile-photos').upload(path,blob,{upsert:true,contentType:'image/jpeg'});if(u.error)throw u.error;let q=await sb.from('user_profiles').upsert({id:currentUser.id,photo_path:path,updated_at:new Date().toISOString()});if(q.error)throw q.error;let s=await sb.storage.from('profile-photos').createSignedUrl(path,3600);profileUrl=s.data.signedUrl;renderProfileMini()}
function renderProfileMini(){let e=document.getElementById('profileMini');if(e)e.innerHTML=profileUrl?`<img class="avatar" src="${esc(profileUrl)}" title="Photo de profil">`:'👤'}
async function unlock(){let v=document.getElementById('pin').value;if(v===APP_PASSWORD){failedAttempts=0;document.getElementById('login').style.display='none';document.getElementById('pin').value='';await connectCloud();startAutoLock()}else{failedAttempts++;document.getElementById('loginError').textContent=`Mot de passe incorrect (${failedAttempts}/3).`;if(failedAttempts>=3){failedAttempts=0;await captureSecurityAttempt()}}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('login').style.display!=='none')unlock()});
function startAutoLock(){clearTimeout(lockTimer);lockTimer=setTimeout(lockApp,5*60*1000)}function lockApp(){clearTimeout(lockTimer);stopCamera();document.getElementById('login').style.display='flex';document.getElementById('loginError').textContent='Application verrouillée. Entrez le code.';home()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&document.getElementById('login').style.display==='none')lockApp()});window.addEventListener('pagehide',()=>{if(document.getElementById('login').style.display==='none')lockApp()});
async function captureSecurityAttempt(){if(!navigator.mediaDevices?.getUserMedia){alert('La caméra n’est pas disponible dans ce navigateur. Ouvrez l’application depuis HTTPS.');return}let modal=document.createElement('div');modal.className='login';modal.id='cameraModal';modal.innerHTML='<div class="loginbox"><h2>📷 Vérification de sécurité</h2><p>Trois codes incorrects. Autorisez la caméra avant pour enregistrer une capture de sécurité.</p><div class="cameraBox"><video id="securityVideo" autoplay playsinline></video></div><button id="captureBtn">📸 Prendre la capture</button><button class="secondary" onclick="closeCameraModal()">Fermer</button><p id="cameraMsg" class="small" style="color:#bfdbfe"></p></div>';document.body.appendChild(modal);try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});document.getElementById('securityVideo').srcObject=cameraStream;document.getElementById('captureBtn').onclick=takeSecuritySnapshot}catch(e){document.getElementById('cameraMsg').textContent='Autorisation caméra refusée ou indisponible : '+e.message}}
async function takeSecuritySnapshot(){let v=document.getElementById('securityVideo'),c=document.createElement('canvas');c.width=v.videoWidth||640;c.height=v.videoHeight||480;c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(async b=>{try{if(!currentUser)await connectCloud();let path=currentUser.id+'/'+Date.now()+'.jpg';let up=await sb.storage.from('security-captures').upload(path,b,{upsert:false,contentType:'image/jpeg'});if(up.error)throw up.error;let q=await sb.from('security_captures').insert({user_id:currentUser.id,file_path:path});if(q.error)throw q.error;document.getElementById('cameraMsg').textContent='✅ Capture de sécurité enregistrée.';setTimeout(closeCameraModal,800)}catch(e){document.getElementById('cameraMsg').textContent='❌ Enregistrement impossible : '+e.message}},'image/jpeg',.82)}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}function closeCameraModal(){stopCamera();document.getElementById('cameraModal')?.remove()}
function home(){document.getElementById('home').classList.remove('hidden');document.getElementById('page').classList.add('hidden')}
function show(h){document.getElementById('home').classList.add('hidden');let p=document.getElementById('page');p.classList.remove('hidden');p.innerHTML=h}
function openNet(net){let ops=db.operations.filter(x=>x.network===net),com=ops.reduce((a,x)=>a+Number(x.commission||0),0);show(`<button class="secondary" onclick="home()">← Accueil</button><h2>${esc(net)}</h2><p>Opérations : <b>${ops.length}</b> · Commissions : <b>${money(com)}</b></p><button onclick="newOp('${net}')">➕ Nouvelle opération</button><button class="secondary" onclick="listOps('${net}')">📋 Historique</button><button class="secondary" onclick="openDebts('${net}')">🧾 Dettes (${db.debts.filter(d=>d.network===net&&!d.paid).length})</button><div id="sub"></div>`)}
function newOp(net){document.getElementById('sub').innerHTML=`<div class="section"><h3>Nouvelle opération</h3><select id="type"><option>Dépôt</option><option>Retrait</option><option>Transfert</option></select><input id="client" placeholder="Nom ou numéro du client"><input id="amount" type="number" placeholder="Montant en FC"><input id="commission" type="number" placeholder="Commission en FC"><input id="note" placeholder="Observation (facultatif)"><button onclick="addOp('${net}')">Enregistrer</button></div>`}
async function addOp(net){let amount=Number(document.getElementById('amount').value||0),commission=Number(document.getElementById('commission').value||0);if(!amount)return alert('Veuillez saisir un montant.');let op={id:'op_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),network:net,type:document.getElementById('type').value,client:document.getElementById('client').value.trim(),amount,commission,note:document.getElementById('note').value.trim(),date:new Date().toISOString()};db.operations.push(op);save();try{await cloudAddOperation(op)}catch(e){console.warn(e);alert('Opération conservée sur le téléphone, mais la sauvegarde en ligne a échoué.')}openNet(net)}
function listOps(net){let ops=db.operations.filter(x=>x.network===net).slice().reverse();document.getElementById('sub').innerHTML='<h3>Historique</h3>'+(ops.length?ops.map(x=>`<div class="op"><b>${esc(x.type)}</b> — ${money(x.amount)}<br><span class="small">${esc(x.client||'Client non précisé')} · Commission ${money(x.commission)} · ${new Date(x.date).toLocaleString('fr-FR')}</span><br><button class="danger" onclick="deleteOperation('${x.id}','${net}')">🗑️ Supprimer</button></div>`).join(''):'<p>Aucune opération.</p>')}
async function deleteOperation(id,net){let x=db.operations.find(a=>a.id===id);if(!x)return;if(!confirm('Supprimer définitivement cette opération ?'))return;try{await cloudDeleteOperation(x);db.operations=db.operations.filter(a=>a.id!==id);save();listOps(net)}catch(e){alert('Suppression impossible dans Supabase : '+e.message)}}
function openDebts(net){let debts=db.debts.filter(d=>d.network===net&&!d.paid),paid=db.debts.filter(d=>d.network===net&&d.paid).slice().reverse(),total=debts.reduce((a,d)=>a+d.amount,0);document.getElementById('sub').innerHTML=`<div class="section"><h3>🧾 Dettes — ${esc(net)}</h3><p>Montant restant : <b>${money(total)}</b></p><button onclick="newDebt('${net}')">➕ Ajouter une dette</button><h4>Dettes en attente</h4>${debts.length?debts.map(d=>`<div class="op"><b>${esc(d.client)}</b> — ${money(d.amount)}<br><span class="small">${esc(d.note||'Sans observation')} · ${new Date(d.date).toLocaleDateString('fr-FR')}</span><br><button onclick="payDebt('${d.id}')">✅ Paiement reçu</button></div>`).join(''):'<p>Aucune dette en attente.</p>'}<h4>Dettes réglées</h4>${paid.length?paid.map(d=>`<div class="op"><b>${esc(d.client)}</b> — ${money(d.amount)}<br><span class="small">Payée le ${new Date(d.paidDate).toLocaleDateString('fr-FR')}</span>${d.paymentSignature?'<br><span class="badge">✍️ Signature enregistrée</span>':''}<br><button class="danger" onclick="deleteDebt('${d.id}','${net}')">🗑️ Supprimer le paiement</button></div>`).join(''):'<p>Aucun paiement enregistré.</p>'}</div>`}
function newDebt(net){document.getElementById('sub').innerHTML=`<div class="section"><h3>Nouvelle dette — ${esc(net)}</h3><input id="debtClient" placeholder="Nom ou numéro du client"><input id="debtAmount" type="number" min="1" placeholder="Montant dû (FC)"><input id="debtNote" placeholder="Observation (facultatif)"><h4>✍️ Signature du responsable</h4><canvas id="debtSig" class="signature"></canvas><button class="secondary" onclick="clearSignature('debtSig')">Effacer la signature</button><button onclick="addDebt('${net}')">Enregistrer la dette</button></div>`;initSignature('debtSig')}
async function addDebt(net){let client=document.getElementById('debtClient').value.trim(),amount=Number(document.getElementById('debtAmount').value||0),note=document.getElementById('debtNote').value.trim();if(!client||amount<=0)return alert('Indiquez le client et un montant supérieur à zéro.');let sig=getSignature('debtSig');if(!sig)return alert('Veuillez signer avec le doigt avant d’enregistrer.');let d={id:'debt_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),network:net,client,amount,note,date:new Date().toISOString(),paid:false,paidDate:null,signatureDebt:sig,paymentSignature:null};db.debts.push(d);save();try{await cloudAddDebt(d);openDebts(net);alert('Dette enregistrée avec la signature.')}catch(e){alert('Dette gardée sur le téléphone, mais Supabase a refusé la sauvegarde : '+e.message)}}
async function payDebt(id){let d=db.debts.find(x=>x.id===id);if(!d||d.paid)return;if(!confirm(`Confirmer le paiement de ${d.client} (${money(d.amount)}) ?`))return;document.getElementById('sub').innerHTML=`<div class="section"><h3>✍️ Signature du paiement</h3><p>${esc(d.client)} — ${money(d.amount)}</p><canvas id="paySig" class="signature"></canvas><button class="secondary" onclick="clearSignature('paySig')">Effacer</button><button onclick="confirmPayDebt('${id}')">Enregistrer le paiement</button><button class="secondary" onclick="openDebts('${d.network}')">Annuler</button></div>`;initSignature('paySig')}
async function confirmPayDebt(id){let d=db.debts.find(x=>x.id===id);if(!d)return;let sig=getSignature('paySig');if(!sig)return alert('Veuillez signer avec le doigt.');d.paid=true;d.paidDate=new Date().toISOString();d.paymentSignature=sig;try{await cloudPayDebt(d);save();openDebts(d.network);alert('Paiement enregistré avec la signature.')}catch(e){d.paid=false;d.paidDate=null;d.paymentSignature=null;save();alert('Paiement non enregistré dans Supabase : '+e.message)}}
async function deleteDebt(id,net){let d=db.debts.find(x=>x.id===id);if(!d)return;if(!confirm('Supprimer définitivement ce paiement et cette dette réglée ?'))return;try{await cloudDeleteDebt(d);db.debts=db.debts.filter(x=>x.id!==id);save();openDebts(net)}catch(e){alert('Suppression impossible dans Supabase : '+e.message)}}
function initSignature(id){let c=document.getElementById(id);let ctx=c.getContext('2d');ctx.lineWidth=2;ctx.lineCap='round';let drawing=false,last=null;function pos(e){let r=c.getBoundingClientRect(),p=e.touches?.[0]||e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}}function start(e){e.preventDefault();drawing=true;last=pos(e)}function move(e){if(!drawing)return;e.preventDefault();let p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function end(){drawing=false}c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);c.addEventListener('pointerup',end);c.addEventListener('pointerleave',end)}
function getSignature(id){let c=document.getElementById(id);if(!c)return null;let blank=document.createElement('canvas');blank.width=c.width;blank.height=c.height;return c.toDataURL('image/png')===blank.toDataURL('image/png')?null:c.toDataURL('image/png')}
function clearSignature(id){let c=document.getElementById(id);if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
function openCash(){let e=db.operations.reduce((a,x)=>a+(x.type==='Dépôt'?x.amount:x.type==='Retrait'?-x.amount:0),0);show(`<button class="secondary" onclick="home()">← Accueil</button><h2>💵 Caisse</h2><p class="stat">${money(e)}</p><p>Solde indicatif basé sur les opérations.</p>`)}
function openReports(){let total=db.operations.reduce((a,x)=>a+x.amount,0),com=db.operations.reduce((a,x)=>a+Number(x.commission||0),0);show(`<button class="secondary" onclick="home()">← Accueil</button><h2>📊 Rapports</h2><div class="section"><p>Nombre d'opérations</p><div class="stat">${db.operations.length}</div></div><div class="section"><p>Volume total</p><div class="stat">${money(total)}</div></div><div class="section"><p>Commissions</p><div class="stat">${money(com)}</div></div>`)}
async function openSettings(){show(`<button class="secondary" onclick="home()">← Accueil</button><h2>⚙️ Paramètres</h2><div class="section"><h3>👤 Ma photo de profil</h3>${profileUrl?`<img class="avatar" src="${esc(profileUrl)}"><br>`:''}<input id="profileInput" type="file" accept="image/*"><button onclick="changeProfile()">📷 Enregistrer ma photo</button></div><div class="section"><h3>🔐 Sécurité</h3><p>Verrouillage automatique lorsque l'application passe en arrière-plan et après 5 minutes d'inactivité.</p><button onclick="lockApp()">🔒 Verrouiller maintenant</button></div><div class="section"><h3>☁️ Supabase</h3><p id="cloudStatus">Vérification...</p></div>`);let r=await connectCloud();let e=document.getElementById('cloudStatus');if(e)e.textContent=r.ok?'✅ Supabase connecté.':'⚠️ Supabase non connecté.'}
async function changeProfile(){let f=document.getElementById('profileInput').files[0];if(!f)return alert('Choisissez une photo.');try{await saveProfilePhoto(f);alert('✅ Photo de profil enregistrée en ligne.')}catch(e){alert('Photo impossible : '+e.message)}}
function openOther(){show(`<button class="secondary" onclick="home()">← Accueil</button><h2>➕ Autres activités</h2><input id="otherName" placeholder="Nom de l'activité"><button onclick="addOther()">Ajouter</button><div id="others">${db.others.map(x=>`<div class="op">📌 <b>${esc(x)}</b></div>`).join('')}</div>`)}
async function addOther(){let n=document.getElementById('otherName').value.trim();if(!n)return;db.others.push(n);save();try{await cloudAddActivity(n)}catch(e){console.warn(e)}openOther()}
function compressImage(file,maxSide,quality){return new Promise((resolve,reject)=>{if(!file?.type?.startsWith('image/'))return reject(Error('Fichier image invalide'));let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let s=Math.min(1,maxSide/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);c.toBlob(b=>b?resolve(b):reject(Error('Compression impossible')),'image/jpeg',quality)};im.onerror=()=>reject(Error('Image invalide'));im.src=r.result};r.onerror=()=>reject(Error('Lecture impossible'));r.readAsDataURL(file)})}
connectCloud();
</script></body></html>
