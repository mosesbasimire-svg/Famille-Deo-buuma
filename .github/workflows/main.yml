- name: Preparer l'application
  run: |
    if [ -d "work_mca" ]; then
      SOURCE_DIR="work_mca"
    elif [ -f "index.html" ]; then
      SOURCE_DIR="."
    else
      echo "Fichiers de Ma Caisse introuvables"
      exit 1
    fi

    cordova create android-app com.mosesbasimire.macaisse MaCaisse

    rm -rf android-app/www/*
    cp -R "$SOURCE_DIR"/. android-app/www/
